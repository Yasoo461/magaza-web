<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kargo Seçimi - Adım 2</title>
    <link rel="stylesheet" href="odeme.style.css" />
    <style>
      .shipping-options {
        display: grid;
        gap: 0.8rem;
        margin: 1rem 0;
      }
      .shipping-option {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        padding: 1rem 1.1rem;
        border: 1px solid #d9e2e1;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        transition: 0.2s;
      }
      .shipping-option:hover {
        border-color: #254d4d;
      }
      .shipping-option:has(input:checked) {
        border-color: #254d4d;
        background: #f1f6f5;
        box-shadow: 0 0 0 3px rgba(37, 77, 77, 0.12);
      }
      .shipping-option input {
        accent-color: #254d4d;
        width: 18px;
        height: 18px;
      }
      .shipping-option .info {
        flex: 1;
      }
      .shipping-option .info strong {
        display: block;
      }
      .shipping-option .info small {
        color: #737373;
      }
      .shipping-option .cost {
        font-weight: 700;
        color: #254d4d;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="checkout-container">
      <div class="checkout-main">
        <div class="checkout-stepper">
          <div
            class="step completed"
            onclick="window.location.href = 'adres.html'"
          >
            <span class="step-number">✓</span>
            <span class="step-title">Adres Bilgileri</span>
          </div>
          <div class="step-line"></div>
          <div class="step active">
            <span class="step-number">2</span>
            <span class="step-title">Kargo Seçimi</span>
          </div>
          <div class="step-line"></div>
          <div class="step">
            <span class="step-number">3</span>
            <span class="step-title">Ödeme Seçenekleri</span>
          </div>
        </div>

        <h2>2. Kargo Seçimi</h2>
        <form id="shipping-form">
          <div class="shipping-options">
            <label class="shipping-option">
              <input type="radio" name="shipping" value="30" checked />
              <span class="info"
                ><strong>Standart Kargo</strong><small>3-5 iş günü</small></span
              >
              <span class="cost">30,00 TL</span>
            </label>
            <label class="shipping-option">
              <input type="radio" name="shipping" value="60" />
              <span class="info"
                ><strong>Hızlı Kargo</strong><small>1-2 iş günü</small></span
              >
              <span class="cost">60,00 TL</span>
            </label>
            <label class="shipping-option">
              <input type="radio" name="shipping" value="0" />
              <span class="info"
                ><strong>Mağazadan Teslim</strong
                ><small>Siparişinizi mağazamızdan alın</small></span
              >
              <span class="cost">Ücretsiz</span>
            </label>
          </div>

          <div class="step-buttons">
            <button
              type="button"
              class="prev-step-btn"
              onclick="window.location.href = 'adres.html'"
            >
              Geri
            </button>
            <button type="submit" class="submit-order-btn">Ödemeye Geç</button>
          </div>
        </form>
      </div>

      <div class="order-summary-section">
        <h3>Sipariş Özeti</h3>
        <div id="checkout-cart-items" class="summary-items"></div>
        <div class="summary-totals">
          <div class="summary-row">
            <span>Ara Toplam:</span>
            <span id="subtotal-price">0,00 TL</span>
          </div>
          <div class="summary-row">
            <span>Kargo Ücreti:</span>
            <span id="shipping-price">30,00 TL</span>
          </div>
          <hr />
          <div class="summary-row total-row">
            <span>Toplam Tutar:</span>
            <span id="final-total-price">0,00 TL</span>
          </div>
        </div>
      </div>
    </div>

    <script src="kargo.js"></script>
  </body>
</html>
