<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furni.shop | Yönetim Paneli</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="index.html" class="brand">furni.shop</a>
      <a href="index.html" class="store-link">Mağazaya Dön →</a>
    </header>

    <main class="dashboard">
      <section class="heading">
        <p class="eyebrow">MAĞAZA YÖNETİMİ</p>
        <h1>Ürün Yönetimi</h1>
        <p>Ürünlerini buradan ekleyebilir, düzenleyebilir ve silebilirsin.</p>
      </section>

      <section class="panel">
        <h2 id="form-title">Yeni Ürün Ekle</h2>

        <form id="product-form">
          <label for="product-name">Ürün adı</label>
          <input
            id="product-name"
            required
            maxlength="100"
            placeholder="Örn. Modern Ahşap Sandalye"
          />

          <label for="product-price">Fiyat (TL)</label>
          <input
            id="product-price"
            type="number"
            min="0.01"
            step="0.01"
            required
            placeholder="1250"
          />

          <label for="product-category">Kategori</label>
          <select id="product-category" required>
            <option value="">Kategori seç</option>
            <option value="Sandalye">Sandalye</option>
            <option value="Masa">Masa</option>
            <option value="Koltuk">Koltuk</option>
            <option value="Aydınlatma">Aydınlatma</option>
            <option value="Dolap">Dolap</option>
            <option value="Diğer">Diğer</option>
          </select>

          <label for="product-description">Ürün açıklaması</label>
          <textarea
            id="product-description"
            rows="4"
            maxlength="1000"
            placeholder="Ürünün özelliklerini yaz..."
          ></textarea>

          <label for="product-image">Ürün fotoğrafı</label>
          <input
            id="product-image"
            type="file"
            accept="image/png,image/jpeg,image/webp"
          />

          <img id="image-preview" alt="Ürün ön izlemesi" hidden />

          <p class="hint">
            En fazla 2 MB boyutunda JPG, PNG veya WebP görsel seç.
          </p>

          <div class="form-actions">
            <button type="submit" id="save-button" class="primary">
              Ürünü Kaydet
            </button>
            <button type="button" id="cancel-edit" class="secondary" hidden>
              Düzenlemeyi İptal Et
            </button>
          </div>

          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel inventory">
        <div class="inventory-heading">
          <h2>Mağazadaki Ürünler</h2>
          <span id="product-count">0 ürün</span>
        </div>

        <div id="product-list" class="product-list"></div>
      </section>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
