<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adres Bilgileri - Adım 1</title>
    <link rel="stylesheet" href="odeme.style.css" />
    <style>
      .form-group textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
        resize: vertical;
        min-height: 90px;
      }
    </style>
  </head>
  <body>
    <div class="checkout-container">
      <div class="checkout-main">
        <div class="checkout-stepper">
          <div class="step active">
            <span class="step-number">1</span>
            <span class="step-title">Adres Bilgileri</span>
          </div>
          <div class="step-line"></div>
          <div class="step">
            <span class="step-number">2</span>
            <span class="step-title">Kargo Seçimi</span>
          </div>
          <div class="step-line"></div>
          <div class="step">
            <span class="step-number">3</span>
            <span class="step-title">Ödeme Seçenekleri</span>
          </div>
        </div>

        <h2>1. Teslimat ve İletişim Bilgileri</h2>
        <form id="address-form" novalidate>
          <div class="form-group">
            <label for="fullname">Ad Soyad *</label>
            <input
              type="text"
              id="fullname"
              required
              placeholder="Ahmet Yılmaz"
            />
          </div>
          <div class="form-group-row">
            <div class="form-group">
              <label for="phone">Telefon *</label>
              <input
                type="tel"
                id="phone"
                required
                placeholder="05xx xxx xx xx"
              />
            </div>
            <div class="form-group">
              <label for="email">E-posta *</label>
              <input
                type="email"
                id="email"
                required
                placeholder="ornek@mail.com"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="address">Açık Adres *</label>
            <textarea
              id="address"
              required
              placeholder="Mahalle, sokak, bina no, daire no, ilçe / il"
            ></textarea>
          </div>

          <p
            id="form-error"
            role="alert"
            style="color: #d64545; min-height: 1.3em; margin: 0.5rem 0"
          ></p>

          <div class="step-buttons">
            <button
              type="button"
              class="prev-step-btn"
              onclick="window.location.href = 'index.html'"
            >
              Alışverişe Dön
            </button>
            <button type="submit" class="submit-order-btn">
              Kargo Seçimine Geç
            </button>
          </div>
        </form>
      </div>

      <div class="order-summary-section">
        <h3>Sipariş Özeti</h3>
        <div id="checkout-cart-items" class="summary-items"></div>
        <div class="summary-totals">
          <div class="summary-row">
            <span>Ara Toplam:</span>
            <span id="subtotal-price">0,00 TL</span>
          </div>
          <div class="summary-row">
            <span>Kargo Ücreti:</span>
            <span>Sonraki adımda</span>
          </div>
        </div>
      </div>
    </div>

    <script src="adres.js"></script>
  </body>
</html>
